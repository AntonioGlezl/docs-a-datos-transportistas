<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f3a5f">
  <title>Docs a datos</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Docs a datos</h1>
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" data-view="capture" aria-selected="true">Capturar</button>
      <button type="button" role="tab" data-view="list" aria-selected="false">Documentos <span id="pending-badge" class="badge" hidden></span></button>
    </nav>
  </header>

  <main>
    <!-- Capture: driver takes a photo or uploads images/PDF -->
    <section id="view-capture" class="view">
      <label class="field">
        <span>Repartidor</span>
        <input id="driver" type="text" autocomplete="name" placeholder="Tu nombre">
      </label>

      <div class="capture-buttons">
        <label class="btn btn-primary btn-big">
          📷 Hacer foto
          <input id="camera-input" type="file" accept="image/*" capture="environment" hidden>
        </label>
        <label class="btn btn-big">
          📄 Subir imagen o PDF
          <input id="file-input" type="file" accept="image/*,application/pdf" multiple hidden>
        </label>
      </div>
      <p class="hint">Puedes añadir varias fotos si el documento tiene varias páginas (máximo <span id="max-pages">3</span>).</p>

      <ul id="page-list" class="page-list"></ul>

      <div class="actions">
        <button id="clear-pages" type="button" class="btn" disabled>Vaciar</button>
        <button id="extract" type="button" class="btn btn-primary" disabled>Extraer datos</button>
      </div>
      <p id="capture-status" class="status" role="status"></p>
    </section>

    <!-- Review: edit extracted data, doubtful fields highlighted -->
    <section id="view-review" class="view" hidden>
      <div class="review-head">
        <button id="back" type="button" class="btn btn-link">← Volver</button>
        <h2 id="review-title">Documento</h2>
        <span id="review-status" class="pill"></span>
      </div>

      <div id="warnings-box" class="warnings" hidden>
        <strong id="warnings-title"></strong>
        <ul id="warnings-list"></ul>
      </div>

      <div class="review-layout">
        <aside id="review-pages" class="review-pages"></aside>
        <form id="review-form" class="review-form" novalidate>
          <div id="field-groups"></div>
          <fieldset class="group">
            <legend>Líneas</legend>
            <div class="table-wrap"><table id="lines-table"></table></div>
            <button id="add-line" type="button" class="btn btn-small">+ Añadir línea</button>
          </fieldset>

          <div class="actions sticky-actions">
            <button id="delete-doc" type="button" class="btn btn-danger">Eliminar</button>
            <button id="save-doc" type="submit" class="btn btn-primary">Guardar</button>
          </div>

          <fieldset class="group office">
            <legend>Oficina</legend>
            <p class="hint">Valida el documento aunque queden avisos, tras comprobarlo con el original.</p>
            <label class="field">
              <span>Validado por</span>
              <input id="reviewer" type="text" autocomplete="name">
            </label>
            <button id="verify-doc" type="button" class="btn btn-success">Validar documento</button>
          </fieldset>
          <p id="review-message" class="status" role="status"></p>
        </form>
      </div>
    </section>

    <!-- List: all documents, office review queue and Excel export -->
    <section id="view-list" class="view" hidden>
      <div class="list-toolbar">
        <label class="field inline">
          <span>Mostrar</span>
          <select id="status-filter">
            <option value="">Todos</option>
            <option value="pending">Pendientes de revisión</option>
            <option value="ok">Correctos</option>
            <option value="verified">Validados</option>
          </select>
        </label>
        <a id="export-link" class="btn btn-primary" href="/api/export.xlsx">⬇ Exportar Excel</a>
      </div>
      <ul id="doc-list" class="doc-list"></ul>
      <p id="list-empty" class="hint" hidden>No hay documentos.</p>
    </section>
  </main>

  <dialog id="image-dialog">
    <img id="image-dialog-img" alt="Página del documento">
    <form method="dialog"><button class="btn">Cerrar</button></form>
  </dialog>

  <script type="module" src="/app.js"></script>
</body>
</html>
